# GitLab CI for the Check-Host Node.js SDK.
#
# Sync to github.com/Check-Host/nodejs-lib is handled by a GitLab native
# push mirror (Settings -> Repository -> Mirroring repositories), not by
# a CI job here.
#
# Runs on the Docker-executor runner registered on the GitLab host -
# each job spawns a clean Node container so the runner host stays
# pristine.

stages:
  - test

default:
  image: node:20-alpine

# Deterministic, offline unit tests - fetch is stubbed, so this job is
# unaffected by API availability or rate limits.
test:
  stage: test
  script:
    - node --version
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Live smoke test against the production API. Exits non-zero on failure.
# Allowed to fail so a transient API blip or rate limit doesn't block a
# release, but it still shows up in the pipeline.
test_live:
  stage: test
  script:
    - node --version
    - npm run test:live
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Optional GitLab-side publish to npm. Triggered by tags matching
# /^v[0-9]+\.[0-9]+\.[0-9]+/ and requires NPM_TOKEN as a masked CI/CD
# variable. The primary publish path remains the GitHub Action
# `.github/workflows/publish.yml`.
# npm publishing lives in .github/workflows/publish.yml and runs on the
# GitHub mirror via npm Trusted Publishing (OIDC) — no token is stored
# anywhere. Pushing a v* tag here mirrors it to GitHub, which triggers the
# publish. The job that used to live here needed an NPM_TOKEN CI variable
# that was never set, so it silently never ran.
