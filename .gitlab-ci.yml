# GitLab CI for the Check-Host Node.js SDK.
#
# Sync to github.com/Check-Host/nodejs-lib is handled by a GitLab native
# push mirror (Settings -> Repository -> Mirroring repositories), not by
# a CI job here.
#
# Each job runs inside a clean Node.js container via `docker run`.
# The runner host must have Docker available (via socket or its own
# Docker executor). The default shell executor on a Debian host fits
# this pattern as long as the `docker` CLI is on PATH and the runner
# user has access to /var/run/docker.sock.

stages:
  - test
  - publish

variables:
  NODE_IMAGE: "node:20-alpine"

.run_in_node: &run_in_node
  - >-
    docker run --rm
    -v "$CI_PROJECT_DIR:/work"
    -w /work
    "$NODE_IMAGE"
    sh -c "$JOB_SCRIPT"

test:
  stage: test
  variables:
    JOB_SCRIPT: "node --version && node test_run.js"
  script:
    - *run_in_node
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Optional GitLab-side publish to npm. Triggered by tags matching
# /^v[0-9]+\.[0-9]+\.[0-9]+/ and requires NPM_TOKEN as a masked CI/CD
# variable. The primary publish path remains the GitHub Action
# `.github/workflows/publish.yml`.
publish_npm:
  stage: publish
  variables:
    JOB_SCRIPT: "echo \"//registry.npmjs.org/:_authToken=$NPM_TOKEN\" > .npmrc && npm publish --access public"
  script:
    - >-
      docker run --rm
      -v "$CI_PROJECT_DIR:/work" -w /work
      -e NPM_TOKEN="$NPM_TOKEN"
      "$NODE_IMAGE"
      sh -c "$JOB_SCRIPT"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/ && $NPM_TOKEN
